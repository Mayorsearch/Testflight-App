# ==============================================================================
# iMediaSave — iOS TestFlight Deployment Workflow
#
# Triggers:
#   - Manual dispatch (workflow_dispatch) — deploy any version on demand
#   - Push to 'release/**' branches
#
# Required GitHub Secrets (set in Environment: "production"):
#   See docs/CODE_SIGNING.md for the full list.
#
# Environment: "production" — requires manual approval gate before deploy.
# ==============================================================================

name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.2.0)'
        required: true
        default: '1.0.0'
      release_notes:
        description: 'TestFlight changelog / release notes'
        required: false
        default: 'New build — see commit history for details.'
  push:
    branches:
      - 'release/**'

concurrency:
  group: ios-deploy-${{ github.ref }}
  cancel-in-progress: false  # Never cancel in-flight deploys

jobs:
  deploy-ios:
    name: Build & Upload to TestFlight
    runs-on: macos-14
    environment: production   # Manual approval gate
    permissions:
      contents: read

    env:
      # Passed into Fastlane
      VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
      BUILD_NUMBER: ${{ github.run_number }}
      RELEASE_NOTES: ${{ github.event.inputs.release_notes || 'New build — see commit history.' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for changelog generation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods dependencies
        run: |
          cd ios && pod install --repo-update

      - name: Write App Store Connect API key
        run: |
          echo '${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}' > fastlane/api_key.json
        # api_key.json is in .gitignore — never committed

      - name: Bump version & build number
        run: |
          node scripts/bump-version.js \
            --version "$VERSION_NAME" \
            --build "$BUILD_NUMBER"

      - name: Fastlane — iOS beta lane
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: fastlane/api_key.json
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          APP_ENV: prod
          API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
        run: bundle exec fastlane ios beta

      - name: Clean up API key
        if: always()
        run: rm -f fastlane/api_key.json

      - name: Upload build artifact (IPA)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iMediaSave-ios-${{ github.run_number }}
          path: build/ios/iMediaSave.ipa
          retention-days: 30
