# ==============================================================================
# iMediaSave — CI Validation Workflow
#
# Triggers: Push / PR to main or release/** branches
# Jobs:
#   1. lint      — ESLint + TypeScript type-check
#   2. test      — Jest unit tests
#   3. build-ios — Xcode build sanity check (no signing)
#   4. build-android — Gradle assemble (no signing)
# ==============================================================================

name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint & Type-check ────────────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Run TypeScript type-check
        run: yarn type-check

  # ── Unit Tests ───────────────────────────────────────────────────────────────
  test:
    name: Jest Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        run: yarn test --coverage --ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ── iOS Build Check ──────────────────────────────────────────────────────────
  build-ios:
    name: iOS Build Check
    runs-on: macos-14
    needs: [lint, test]
    env:
      APP_ENV: dev
      APP_NAME: iMediaSave Dev
      APP_BUNDLE_ID: com.imediasave.app.dev
      APP_VERSION_NAME: '1.0.0'
      API_BASE_URL: https://api-dev.imediasave.com
      API_TIMEOUT_MS: '30000'
      FEATURE_ANALYTICS: '0'
      FEATURE_CRASHLYTICS: '0'
      FEATURE_PUSH_NOTIFICATIONS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          cd ios && pod install --repo-update
        continue-on-error: true  # Pods not yet configured — passes once ios/ is added

      - name: Build iOS (no signing)
        run: |
          xcodebuild \
            -workspace ios/iMediaSave.xcworkspace \
            -scheme iMediaSave \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
        continue-on-error: true  # Will pass once ios/ folder is committed

  # ── Android Build Check ──────────────────────────────────────────────────────
  build-android:
    name: Android Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    env:
      APP_ENV: dev
      APP_NAME: iMediaSave Dev
      APP_BUNDLE_ID: com.imediasave.app.dev
      APP_VERSION_NAME: '1.0.0'
      API_BASE_URL: https://api-dev.imediasave.com
      API_TIMEOUT_MS: '30000'
      FEATURE_ANALYTICS: '0'
      FEATURE_CRASHLYTICS: '0'
      FEATURE_PUSH_NOTIFICATIONS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Debug
        run: |
          cd android && ./gradlew assembleDebug --no-daemon
        continue-on-error: true  # Will pass once android/ folder is committed
